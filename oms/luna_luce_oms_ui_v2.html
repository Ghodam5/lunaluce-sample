<!DOCTYPE html>
<!--
Luna Luce OMS 2.9
この画面を新しく作るか広げるたびに、見える版を 0.1 上げる。

2.7 から部品ごとのファイルに分けた（見た目と動きは2.6と同じ）。
このHTMLは外枠だけ。中身は css/ と js/ にあり、番号順に読み込む（順番を入れ替えない）。
  css/01-base … 11-builder   各ファイル内の /* owner: renderX */ がその部品のCSS
  js/01-settings        日付・締め時刻・部品キー・書体
  js/02-miniseal-match  ミニシール図柄・グループ・受注文字からの自動判定
  js/03-core            デザイン型・工程・販路・state・共通関数・料金と送料の式
  js/04-seed-orders     見本の受注データ
  js/05-db-schema       DBスキーマ表示用の表定義
  js/06-order-helpers   並び順・絞り込み・部品の組み立て(mountOrdered)
  js/07-header          ヘッダー
  js/08-dashboard-orders KPI・部材在庫・絞り込み・受注一覧
  js/09-product-search  商品検索
  js/10-channel-match   販路の突き合わせ
  js/11-dashboard       統合受注タブの並び(DASHBOARD_PARTS)
  js/12-site-data       サイト掲載データの読み込み・検査・書き出し
  js/13-site-tab        サイト掲載タブの画面
  js/14-info-tabs       システム・DBスキーマ・加工CSV・契約送料タブ
  js/15-main            タブの切り替え表示
  js/16-drawer          受注詳細(ドロワー)の各部品
  js/17-modal-toast     手動登録・通知・全体の並び(APP_PARTS)
  js/18-actions         ボタン操作(runAction)とイベント
  js/19-builder-model   サイトビルダーのデータ・検査・書き出し（データは builder-data.json）
  js/20-builder-list    サイトビルダー左列（一覧・並べ替え・追加）
  js/21-builder-editor  サイトビルダー真ん中（選んだ部品を直す）
  js/22-builder-preview サイトビルダー右列（見え方・確認・書き出し）
  js/23-builder-tab     サイトビルダーの3列の枠と操作
  js/90-start           起動（必ず最後）
新しい部品は新しい番号のファイルとして足し、既存ファイルに詰め込まない。
2.8 でサイトビルダー（7のタブ）を追加。builder-data.json は tools/oms-builder-data.cjs で作り、直接編集しない。
2.9 でおすすめ特集カードにも上の画像を付けられるようにし（特集は1〜8つ・並べ替え可）、ビルダーから画像を取り込めるようにした（下書きに入り、反映時に images/uploads/ に置く）。
部品名と、その部品を持つ関数。ラベル・寸法・中身は、その関数と、同じ名前のCSSだけを変える。
並び順は関数の外にある配列だけを入れ替える。

header                 renderHeader
header-brand           renderHeaderBrand
header-status          renderHeaderStatus
header-tabs            renderHeaderTabs
tab-dashboard          renderDashboard
kpi-strip              renderKpiStrip
part-stock             renderPartStockStrip
product-search         renderProductSearch
channel-match          renderChannelMatch
order-filters          renderOrderFilters
order-list             renderOrderList
tab-architecture       renderArchitectureTab
tab-schema             renderSchemaTab
tab-simulator          renderSimulatorTab
tab-carrier            renderCarrierTab
tab-site               renderSiteTab
site-notices           renderSiteNotices
site-calendar          renderSiteCalendar
site-promos            renderSitePromos
drawer                 renderDrawer
drawer-head            renderDrawerHead
drawer-warning         renderDrawerWarning
drawer-preview         renderDrawerPreview
drawer-samples         renderDrawerSamples
drawer-miniseal        renderDrawerMiniseal
drawer-parts           renderDrawerParts
drawer-fees            renderDrawerFees
drawer-campaign        renderDrawerCampaign
drawer-schedule        renderDrawerSchedule
drawer-rush            renderDrawerRush
drawer-proof           renderDrawerProof
drawer-sheet           renderDrawerSheet
drawer-realsize        renderDrawerRealSize
drawer-stock           renderDrawerStock
drawer-edit            renderDrawerEdit
drawer-raw             renderDrawerRaw
drawer-actions         renderDrawerActions
manual-modal           renderManualModal
toast                  renderToast

配列: APP_PARTS, HEADER_PARTS, DASHBOARD_PARTS, SITE_PARTS, DRAWER_PARTS

操作: switchTab, triggerManualSync, setChannelFilter, setStatusFilter,
filterByUrgency, filterByWarning, resetSpecialFilters, onSearch,
toggleSelectAll, toggleSingleSelect, quickChangeStatus, openOrderDrawer,
closeOrderDrawer, onEditInput, saveDrawerEdits, toggleRushTicket,
markProofSent, markProofApproved, confirmOrderStock, triggerSingleAction,
openManualOrderModal, closeManualOrderModal, submitManualOrder,
selectSchemaTable, copySqlDdl, goToSimulatorWithSelected,
downloadSimulatedCsv, showToast, onProductQuery, pickCatalogProduct, onMatchQuery, setOrderSort, loadSiteFile,
exportSiteDraft, onSiteField, moveSitePromo, addSiteRow, removeSiteRow,
setCarrierMode, setCarrierZone, setCarrierSize, pickMiniSeal

料金の式は feeNumbers だけ。1注文につき1回、¥500＋¥20×文字数。のし¥20。ラッピング¥90。
キャンペーンは名前の表示だけ。例: 5円ご縁。
ヤマト契約送料は yamatoContractCost だけ。お客様の送料には入れない。ネコポスは280円で、サイズ表の行ではない。
商品検索は product-search だけ。同じフォルダの oms-products.json を読む。キャンペーンの計算はしない。
販路の突き合わせは channel-match だけ。同じフォルダの oms-channel-match.json を読む。価格は上書きしない。
ミニシールの図柄選択は drawer-miniseal だけ。画像は miniseal/。枠は角丸スクエアで、円形の見本は使わない。
受注の選択肢の文字から図柄を決めるのは matchSealText だけ。番号と名前が両方合う時と、名前が1つに決まる時だけ自動で入れる。
迷う時（候補が複数・番号と名前が食い違う・見つからない）は入れずに担当者へ選んでもらう。販路ごとの言い換えは SEAL_ALIASES に足す。
図柄のグループ分けは SEAL_GROUPS だけ。59図柄はどれか1つのグループに必ず入れる。
-->
