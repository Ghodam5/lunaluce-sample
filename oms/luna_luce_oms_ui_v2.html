2.51 で統合受注に「日付で作業QR表（PDF）」を足した（日付と、納期・挙式日・受付日のどれで選ぶか → その日の注文を1枚の表にしてPDF保存・印刷。1行に注文ごとのスマホ作業用QR・注文番号・商品・数・名入れ・日付・工程・済の欄。住所などは載せない。js/54-day-sheet）。スマホの作業画面に「QRを読む」ボタン（カメラでQRを写すと注文が開く。iPhone・Android。vendor/jsQR.js、work/work-scan.js）。
2.50 で工程と作業ログをサーバーに残すようにした（林さんの開発依頼書 第1段階）。受注明細の出力を「PDF保存・PDF印刷・スマホで作業開始」の3つにし、作業指示書の右上にQRコード（iPhoneで写すと work.html のスマホ作業画面。工程ごとに「終わった」・取り消し・コメント）。受注明細に「作業の記録」、タブ「9 作業ログ」（フリーワード・注文番号・お客様・新郎新婦・商品・SKU・人・工程・日付で探す）。統合受注の検索はあいまい検索（全角半角・カナかな・記号・1文字ちがい）にして候補を出す（js/51-fuzzy・52-work-log・53-work-log-tab・css/17-work・work.html・work/・vendor/qrcode.js）。作業員のログインでは住所・電話・メール・お届け先・受信メモ・送り状CSVを出さず、タブは1と9だけ。サーバーは ops/vps/oms-app/work.js（vps-oms-setup）。
2.49 で看板に「写真の上の演出」を足した（花びら＝いままで・雪・紙吹雪・キラキラ・なし。看板ごと。右の見本でも動く。サイトの effect、v72）。
2.48 で、2.47 より前に作った下書きがあるブラウザでも「いちばん上の看板」が出るようにした（下書きを作った後にサイトに足されたカードは、サイトの元データから足す。下書きで消したカードは戻さない。下書きに cardsKnown を残す）。
2.47 でサイトビルダーに「いちばん上の看板」を足した（js/50-builder-sign・css/16-builder-sign）。トップを開いて最初に見える大きなカード（写真・バッジ・見出し・説明・ボタン2つ）を、「トップのカード」とは別のコーラル色の枠で並べ、押すと写真・写真の説明・バッジ・見出し（改行そのまま）・色を変える言葉・説明・ボタン（文字・色・行き先。トップの売れ筋へも飛ばせる）・カードの色・期間を変えられる。「＋ 看板を足す」で増やせる。並べ替えは看板どうし・カードどうしで、書き出しでは看板が先。サイトの site-src/home-promos の kind: "message"（tools/home-message.cjs）と同じ形。
2.46 で「7 販路と価格」と「8 お客様の声」を足した。販路と価格: 商品は1つ（基準の値段＝本店のバックアップの値段）、販路ごとに「基準のまま・基準の○%上げ・この値段に固定」と出す・出さないを持つ（販路の標準＋商品ごとの上書き）。扱う商品は絞り込める（最初は新サイトにある商品）。モールの決まり（上げ幅の上限・差の上限・下限・商品名に使えない言葉・書いておくだけ）をいつでも足せ、合わない所に注意を出す。値段を変えた記録を残す。楽天・Yahoo用CSVの値段もこれに従う。お客様の声: 受け口（楽天・Yahoo・本店・メール・LINE・SMS・電話、足せる）から手入力かCSVで集め、メールアドレス・電話番号は伏せ字にする。似た質問を自動でまとめ、決めた件数（標準3件）で「よくある質問の候補」に出し、入れる・入れない・保留を人が決める（自動で入れる設定もあり）。入れないと決めたものは、さらに同じ件数増えたら再び候補に出る。口コミは受け口・商品ごとの平均と★2以下の未対応を出す。保存はいまはこのブラウザ（DBスキーマに表を追加）。
2.29 で商品の登録・編集に「お届けまでの日数」（必須・最短〜最長・受注生産）と「ご注文の前に」の定型文の選択を足した（js/37-builder-delivery）。定型文はサイトビルダー「注意事項の定型文」で直す。在庫と出店の一覧に「お届け日数なし」の目印と絞り込み。サイト側は v64。
